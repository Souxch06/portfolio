          <svg viewBox="0 0 24 24" focusable="false">

        Retour à l'accueil

      <section id="contact">
        <h2>Me contacter</h2>
        <p>Utilisez ce formulaire pour m'envoyer un message.</p>
        <form
          action="https://formsubmit.co/lucasafonso0726@gmail.com"
          method="post"
        >
          <input type="hidden" name="_subject" value="Nouveau message depuis le site" />
          <input type="hidden" name="_template" value="table" />
          <input type="hidden" name="_captcha" value="true" />
          <input type="text" name="_honey" tabindex="-1" autocomplete="off" hidden />
          <div class="form-group">
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" required />
          </div>
          <div class="form-group">
            <label for="email">Adresse email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>
          </div>
          <button type="submit" class="btn-primary">Envoyer le message</button>
        </form>
      </section>
    </main>
